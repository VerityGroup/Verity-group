<!DOCTYPE html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Emily | Prudential</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@600;700&family=Noto+Sans+SC:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff;--blush:#fdf0f0;--card:#fff;--ink:#2a1214;--muted:#6b5154;--line:#efd3d4;--hero:#c8102e;--accent:#c8102e;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#170a0c;--blush:#220f12;--card:#2a1316;--ink:#f6e9ea;--muted:#c3a6a9;--line:#4a2a2d;--hero:#9c0f20;--accent:#ff6b73}}
:root[data-theme="dark"]{--bg:#170a0c;--blush:#220f12;--card:#2a1316;--ink:#f6e9ea;--muted:#c3a6a9;--line:#4a2a2d;--hero:#9c0f20;--accent:#ff6b73}
html{scroll-padding-top:env(safe-area-inset-top,0px);scroll-behavior:smooth}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 17px/1.8 "Noto Sans SC",system-ui,-apple-system,"PingFang SC","Microsoft YaHei",Helvetica,Arial,sans-serif}
.wrap{max-width:920px;margin:0 auto;padding:0 22px;position:relative}
h1,h2,h3{font-family:"Noto Serif SC","Songti SC",Georgia,serif;line-height:1.3;margin:0}
:focus-visible{outline:3px solid #ffb3b8;outline-offset:3px}
.hero{background:var(--hero);color:#fff;position:relative;overflow:hidden;padding-bottom:120px}
.hero::before{content:"";position:absolute;right:-140px;top:-140px;width:480px;height:480px;border-radius:50%;border:70px solid rgba(255,255,255,.09)}
.hero::after{content:"";position:absolute;left:-10%;right:-10%;bottom:-1px;height:70px;background:var(--bg);border-radius:50% 50% 0 0/100% 100% 0 0}
nav{display:flex;justify-content:space-between;align-items:center;padding-top:18px;gap:12px}
.brand{font-family:"Noto Serif SC",Georgia,serif;font-weight:700;font-size:19px}
nav .r{display:flex;gap:10px;align-items:center}
.pill{color:#fff;border:1.5px solid rgba(255,255,255,.7);background:transparent;border-radius:999px;padding:5px 15px;font:500 14px/1.5 inherit;font-family:inherit;text-decoration:none;cursor:pointer}
.pill:hover{background:rgba(255,255,255,.15)}
.hero h1{font-size:clamp(34px,7vw,58px);font-weight:700;max-width:12em;margin:64px 0 20px}
.hero p.lead{max-width:30em;font-size:18px;margin:0 0 32px;color:rgba(255,255,255,.92)}
.btns{display:flex;gap:12px;flex-wrap:wrap}
.btn{display:inline-block;padding:13px 26px;border-radius:999px;font:500 17px/1.4 inherit;font-family:inherit;text-decoration:none;border:2px solid #fff;cursor:pointer}
.btn.w{background:#fff;color:#c8102e}
.btn.g{background:transparent;color:#fff}
.btn.r{background:var(--accent);border-color:var(--accent);color:#fff}
html[data-lang] .btn.r{color:#fff}
:root[data-theme="dark"] .btn.r{color:#2a0a0d}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn.r{color:#2a0a0d}}
section{padding:56px 0}
section h2{font-size:29px;margin-bottom:8px}
.sub{color:var(--muted);margin:0 0 30px;max-width:34em}
.svc{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
.svc div{border-left:4px solid var(--accent);padding:2px 0 2px 16px}
.svc h3{font-size:20px;margin-bottom:6px}
.svc p{margin:0;color:var(--muted);font-size:16px;line-height:1.7}
.tint{background:var(--blush)}
.risks{display:grid;grid-template-columns:repeat(5,1fr);gap:14px}
.risk{background:var(--blush);border-top:4px solid var(--accent);padding:16px 14px;border-radius:0 0 10px 10px}
.risk h3{font-size:17px;margin-bottom:6px}
.risk p{margin:0;color:var(--muted);font-size:15px;line-height:1.6}
.close{margin:30px 0 0;font:700 clamp(20px,3.4vw,26px)/1.5 "Noto Serif SC",Georgia,serif;color:var(--accent);max-width:28em}
@media (max-width:860px){.risks{grid-template-columns:repeat(2,1fr)}}
.plans{display:grid;grid-template-columns:1fr 1fr;gap:0 48px}
.plan{padding:18px 0;border-bottom:1px solid var(--line)}
.plan h3{font-size:20px;color:var(--accent);margin-bottom:4px}
.plan p{margin:0;color:var(--muted);font-size:16px;line-height:1.7}
.quote{background:var(--hero);color:#fff;position:relative;overflow:hidden}
.quote::before{content:"";position:absolute;left:-160px;bottom:-160px;width:420px;height:420px;border-radius:50%;border:60px solid rgba(255,255,255,.08)}
.quote .sub{color:rgba(255,255,255,.9)}
form{background:var(--card);color:var(--ink);border-radius:16px;padding:28px;max-width:560px;box-shadow:0 14px 40px rgba(60,0,8,.28)}
label{display:block;font-weight:500;margin:0 0 6px;font-size:16px}
.f{margin-bottom:18px}
input,select,textarea{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:11px 12px}
textarea{min-height:90px;resize:vertical}
.hint{font-size:14px;color:var(--muted);margin:12px 0 0;line-height:1.6}
.err{color:#d3202a;font-size:14px;margin:6px 0 0;min-height:1em}
details{border-bottom:1px solid var(--line);padding:14px 0}
summary{cursor:pointer;font-weight:500}
details p{margin:10px 0 0;color:var(--muted)}
footer{background:var(--blush);padding:30px 0 44px;color:var(--muted);font-size:14px;line-height:1.7}
footer b{color:var(--accent);font-family:"Noto Serif SC",Georgia,serif;font-size:16px}
@media (max-width:700px){.plans,.svc,.risks{grid-template-columns:1fr}.hero h1{margin-top:44px}.hero{padding-bottom:100px}}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
</style>
</head>
<body>
<header class="hero">
  <div class="wrap">
    <nav>
      <span class="brand" data-k="brand"></span>
      <span class="r"><button class="pill" id="lang" type="button" aria-label="Language"></button><a class="pill" href="#quote" data-k="navCta"></a></span>
    </nav>
    <h1 data-k="h1"></h1>
    <p class="lead" data-k="lead"></p>
    <div class="btns"><a class="btn w" href="#quote" data-k="b1"></a><a class="btn g" href="#quote" id="rv" data-k="b2"></a></div>
  </div>
</header>

<main>
<section><div class="wrap">
  <h2 data-k="rkH"></h2>
  <p class="sub" data-k="rkS"></p>
  <div class="risks" id="risks"></div>
  <p class="close" data-k="rkC"></p>
</div></section>

<section class="tint"><div class="wrap">
  <h2 data-k="svcH"></h2>
  <p class="sub" data-k="svcS"></p>
  <div class="svc" id="svc"></div>
</div></section>

<section><div class="wrap">
  <h2 data-k="plH"></h2>
  <p class="sub" data-k="plS"></p>
  <div class="plans" id="plans"></div>
</div></section>

<section class="quote" id="quote"><div class="wrap">
  <h2 data-k="qH"></h2>
  <p class="sub" data-k="qS"></p>
  <form id="qf" novalidate>
    <div class="f"><label for="n" data-k="fn"></label><input id="n" autocomplete="name"><div class="err" id="en"></div></div>
    <div class="f"><label for="p" data-k="fp"></label><input id="p" type="tel" autocomplete="tel" data-ph="fpp"><div class="err" id="ep"></div></div>
    <div class="f"><label for="t" data-k="ft"></label><select id="t"></select></div>
    <div class="f"><label for="a" data-k="fa"></label><input id="a" type="number" min="0" max="100" inputmode="numeric" data-ph="fap"></div>
    <div class="f"><label for="b" data-k="fb"></label><select id="b"></select><div class="err" id="eb"></div></div>
    <div class="f"><label for="m" data-k="fm"></label><textarea id="m" data-ph="fmp"></textarea></div>
    <button class="btn r" type="submit" data-k="send"></button>
    <p class="hint" data-k="hint"></p>
  </form>
</div></section>

<section><div class="wrap">
  <h2 data-k="faqH"></h2>
  <div id="faq"></div>
</div></section>
</main>

<footer><div class="wrap">
  <b>Emily</b> &nbsp;|&nbsp; Prudential<br>
  <span data-k="disc"></span>
</div></footer>

function el(tag,cls,txt){var e=document.createElement(tag);if(cls)e.className=cls;if(txt)e.textContent=txt;return e}
