.brand{font:600 22px/1.2 var(--serif);letter-spacing:.04em;color:var(--brand)}
.nav{display:flex;gap:10px;align-items:center}
.pill{font:500 13px/1 inherit;font-family:inherit;letter-spacing:.06em;color:var(--brand);background:transparent;border:1px solid rgba(110,16,34,.35);padding:10px 17px;border-radius:2px;cursor:pointer;transition:background .25s,border-color .25s}
.pill:hover{background:rgba(110,16,34,.07);border-color:var(--brand)}
.hero{padding:20px 0 84px;border-bottom:1px solid var(--gold)}
.hero .wrap{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:32px;align-items:center}
.hero h1{font:700 clamp(32px,3.7vw,52px)/1.25 "Noto Serif SC","Songti SC",serif;text-wrap:balance;letter-spacing:.02em}
.lead{color:var(--muted);font-size:17.5px;margin:22px 0 34px;max-width:28em}
.visual{aspect-ratio:3/2;background:var(--logo) center/cover no-repeat;-webkit-mask-image:linear-gradient(90deg,transparent 0,#000 26%);mask-image:linear-gradient(90deg,transparent 0,#000 26%)}
.btns{display:flex;gap:12px;flex-wrap:wrap}
.btn{font:500 15px/1 inherit;font-family:inherit;letter-spacing:.08em;padding:16px 32px;border:1px solid var(--btn);border-radius:2px;background:var(--btn);color:#f9f0e9;cursor:pointer;text-decoration:none;display:inline-block;transition:background .3s,box-shadow .3s,transform .3s,color .3s}
.btn:hover{background:#4a0a16;border-color:#4a0a16;box-shadow:0 10px 24px rgba(74,10,22,.28);transform:translateY(-1px)}
.btn.o{background:transparent;color:var(--brand);border-color:var(--brand)}
.btn.o:hover{background:var(--brand);color:#f9f0e9}
.hero .btn.o:hover,.d .btn.o:hover{color:#f9f0e9}
section{padding:96px 0}
.alt{background:var(--alt)}
h2.t{font-size:clamp(28px,3.4vw,40px)}
h2.t::after{content:"";display:block;width:46px;height:2px;background:var(--gold);margin-top:16px}
.c{text-align:center}.c h2.t::after{margin-left:auto;margin-right:auto}
.sub{color:var(--muted);margin:16px 0 0;max-width:34em}.c .sub{margin-left:auto;margin-right:auto}
.tiles{display:flex;flex-wrap:wrap;justify-content:center;gap:22px;margin-top:52px}
.tile{flex:0 0 calc((100% - 66px)/4);aspect-ratio:1/1;padding:0;border:0;border-radius:4px;overflow:hidden;position:relative;cursor:pointer;background:var(--card);box-shadow:0 6px 22px rgba(60,20,28,.13);transition:box-shadow .45s,transform .45s}
.tile img{width:100%;height:100%;display:block;object-fit:cover;transition:transform .9s cubic-bezier(.2,.7,.2,1)}
.tile::after{content:"";position:absolute;inset:0;border:1px solid transparent;border-radius:4px;pointer-events:none;transition:border-color .4s,inset .4s}
.tile:hover{transform:translateY(-5px);box-shadow:0 20px 44px rgba(60,20,28,.28)}
.tile:hover img{transform:scale(1.06)}
.tile:hover::after,.tile:focus-visible::after{border-color:var(--gold);inset:10px}
.grid{display:grid;gap:36px;margin-top:48px}
.g5{grid-template-columns:repeat(5,1fr);gap:28px}.g3{grid-template-columns:repeat(3,1fr)}
.it{border-top:1px solid var(--gold);padding-top:18px}
.it h3{font-size:21px;margin-bottom:8px}
.it p{margin:0;color:var(--muted);font-size:15.5px;line-height:1.75}
.close{margin:56px 0 0;font:italic 500 clamp(22px,2.8vw,30px)/1.5 var(--serif);color:var(--brand);text-align:center}
.band{background:var(--band);color:#f6ebe4}
.band h2{color:#f6ebe4}.band .sub{color:rgba(246,235,228,.82)}
.fcard{background:var(--card);color:var(--ink);border-radius:4px;padding:34px;max-width:640px;margin-top:40px;box-shadow:0 24px 56px rgba(0,0,0,.35)}
label{display:block;font-weight:500;font-size:15px;margin:0 0 6px}
.f{margin-bottom:18px}
input,select,textarea{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:2px;padding:12px 13px;transition:border-color .25s}
input:focus,select:focus,textarea:focus{border-color:var(--gold);outline:0}
textarea{min-height:90px;resize:vertical}
.hint{font-size:13.5px;color:var(--muted);margin:14px 0 0;line-height:1.65}
.err{color:#b3261e;font-size:13.5px;margin:5px 0 0;min-height:1em}
details{border-bottom:1px solid var(--line);padding:18px 0}
summary{cursor:pointer;font-weight:500}
details p{margin:10px 0 0;color:var(--muted)}
.faq{max-width:760px;margin-top:36px}
footer{background:var(--alt);padding:48px 0 56px;color:var(--muted);font-size:13.5px;line-height:1.8;border-top:1px solid var(--gold)}
.flogo{width:170px;aspect-ratio:3/2;background:var(--logo) center/cover no-repeat;border-radius:4px;margin-bottom:18px}
footer b{font:600 17px var(--serif);color:var(--brand);letter-spacing:.04em}
.ft{font:600 22px/1.3 var(--serif);color:var(--brand);margin:0 0 22px}
.prog{display:flex;gap:8px;list-style:none;margin:0;padding:0}
.prog li{flex:1;font-size:12.5px;letter-spacing:.05em;color:var(--muted);border-top:3px solid var(--line);padding-top:8px;transition:border-color .3s,color .3s}
.prog li.on{border-color:var(--gold);color:var(--ink);font-weight:500}.prog li.done{border-color:var(--btn)}
.stp{font-size:13px;color:var(--muted);margin:12px 0 22px}
.step[hidden],.ty[hidden],#qf[hidden]{display:none}
.step{animation:rise .45s cubic-bezier(.2,.7,.2,1) both}
fieldset{border:0;padding:0;margin:0 0 20px;min-width:0}
legend,.lb{padding:0;font-weight:500;font-size:15px;margin:0 0 8px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.sl{display:block;font-size:13px;font-weight:400;color:var(--muted);margin:0 0 4px}
.help{font-size:13px;color:var(--muted);margin:6px 0 0}
.chips{display:flex;flex-wrap:wrap;gap:10px}
.chip{position:relative;margin:0;font-weight:400;font-size:15px}
.chip input{position:absolute;inset:0;width:100%;height:100%;opacity:0;margin:0;cursor:pointer}
.chip span{display:block;padding:12px 18px;border:1px solid var(--line);border-radius:2px;background:var(--bg);transition:background .25s,border-color .25s,color .25s}
.chip:hover span{border-color:var(--gold)}
.chip input:checked+span{background:var(--btn);border-color:var(--btn);color:#f9f0e9}
.chip input:focus-visible+span{outline:2px solid var(--gold);outline-offset:2px}
.chips.col .chip{flex:0 0 100%}
.chk{display:flex;gap:12px;align-items:flex-start;font-weight:400;font-size:14.5px;line-height:1.65;margin:0}
.chk input{width:20px;height:20px;margin-top:3px;flex:none;accent-color:var(--btn)}
.acts{display:flex;gap:12px;flex-wrap:wrap;margin-top:26px}
.acts [hidden]{display:none}
.acts .btn{flex:1 1 auto;text-align:center}
.ty{text-align:center;padding:26px 6px 10px}
.ty h3{font-size:30px;margin-bottom:12px}
.ty p{color:var(--muted);margin:0 0 24px}
.view.in{animation:rise .6s cubic-bezier(.2,.7,.2,1) both}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.d{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.05fr);gap:64px;align-items:center;padding:36px 0 96px}
.pic{border-radius:4px;overflow:hidden;box-shadow:0 26px 56px rgba(60,20,28,.28)}
.pic img{display:block;width:100%;height:auto}
.back{margin:36px 0 0}
.d h2{font-size:clamp(32px,4.2vw,52px);margin-top:6px}
.d .s{font:500 18px var(--serif);letter-spacing:.12em;color:var(--gold);margin-top:6px}
.d .tag{font:italic 500 clamp(19px,2vw,23px)/1.5 var(--serif);color:var(--brand);margin:22px 0 14px}
.d h3{font:600 13px/1 "Jost","Noto Sans SC",sans-serif;letter-spacing:.2em;text-transform:uppercase;color:var(--gold);margin:30px 0 14px}
.d ul{list-style:none;margin:0 0 34px;padding:0}
.d li{padding:9px 0 9px 26px;position:relative;border-bottom:1px solid var(--line)}
.d li::before{content:"";position:absolute;left:4px;top:19px;width:7px;height:7px;background:var(--gold);transform:rotate(45deg)}
.note{font-size:13px;color:var(--muted);margin-top:22px}
@media (max-width:980px){.tile{flex-basis:calc((100% - 44px)/3)}.g5{grid-template-columns:repeat(2,1fr)}
.hero .wrap{grid-template-columns:1fr;gap:6px}.visual{order:-1;-webkit-mask-image:linear-gradient(180deg,#000 80%,transparent),linear-gradient(90deg,transparent,#000 12%,#000 88%,transparent);-webkit-mask-composite:source-in;mask-image:linear-gradient(180deg,#000 80%,transparent),linear-gradient(90deg,transparent,#000 12%,#000 88%,transparent);mask-composite:intersect}
.hero{padding-bottom:64px}section{padding:72px 0}.d{grid-template-columns:1fr;gap:32px}}
@media (max-width:600px){.row2{grid-template-columns:1fr}.fcard{padding:24px 20px}.chip span{padding:12px 15px}.acts .btn{flex:1 1 100%}.tile{flex-basis:calc((100% - 14px)/2)}.tiles{gap:14px}.g5,.g3{grid-template-columns:1fr;gap:24px}.wrap{padding:0 20px}.brand{font-size:19px}.pill{padding:9px 12px}}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}.view.in{animation:none}*{transition:none!important}}
</style>
</head>

var lang="zh",cur=-1;

var $=function(i){return document.getElementById(i)};
function el(tag,cls,txt){var e=document.createElement(tag);if(cls)e.className=cls;if(txt)e.textContent=txt;return e}
function L(){return lang==="zh"?0:1}
function fill(id,list,cls){var box=$(id);box.innerHTML="";list.forEach(function(x){var b=el("div",cls);b.appendChild(el("h3","",x[0]));b.appendChild(el("p","",x[1]));box.appendChild(b)})}
function detail(i){
  var p=P[i],k=L(),d=T[lang];cur=i;
  $("dImg").src=document.querySelectorAll(".tile img")[i].src;$("dImg").alt=p.n[0]+" "+p.n[1];
  $("dN").textContent=p.n[k];$("dS").textContent=p.s?p.s[k]:"";$("dS").hidden=!p.s;
  $("dT").textContent=p.t[k];$("dD").textContent=p.d[k];
  var ul=$("dL");ul.innerHTML="";p.c[k].forEach(function(x){ul.appendChild(el("li","",x))});
}
function apply(){
  var d=T[lang],k=L();
  document.documentElement.lang=lang==="zh"?"zh-Hans":"en";
  document.title=lang==="zh"?"Emily 保险顾问 | Prudential":"Emily · Insurance Advisor | Prudential";
  Array.prototype.forEach.call(document.querySelectorAll("[data-k]"),function(e){e.textContent=d[e.getAttribute("data-k")]});
  Array.prototype.forEach.call(document.querySelectorAll("[data-ph]"),function(e){e.placeholder=d[e.getAttribute("data-ph")]});
  $("back1").textContent=d.back;$("back2").textContent=d.back;$("lang").textContent=d.other;
  var sel=$("t"),idx=sel.selectedIndex<0?0:sel.selectedIndex;sel.innerHTML="";
  [d.o0,d.o1].concat(P.map(function(p){return p.n[k]})).forEach(function(o){var op=document.createElement("option");op.textContent=o;sel.appendChild(op)});sel.selectedIndex=idx;
  var bs=$("b"),bi=bs.selectedIndex<0?0:bs.selectedIndex;bs.innerHTML="";[d.budSel].concat(d.budOpts).forEach(function(o){var op=document.createElement("option");op.textContent=o;bs.appendChild(op)});bs.selectedIndex=bi;
  chips("gChips","g",d.gOpts);chips("smChips","sm",d.smOpts);chips("hChips","hl",d.hOpts);
  fill("risks",d.risks,"it");fill("svc",d.svc,"it");
  var fq=$("faq");fq.innerHTML="";d.faq.forEach(function(x){var b=el("details");b.appendChild(el("summary","",x[0]));b.appendChild(el("p","",x[1]));fq.appendChild(b)});
  if(cur>-1)detail(cur);
  clearErr();updStep();
}
function toQuote(sel){if(sel!==null&&sel!==undefined)$("t").selectedIndex=+sel;$("quote").scrollIntoView({behavior:"smooth"})}
function anim(v){v.classList.remove("in");void v.offsetWidth;v.classList.add("in")}
function route(){
  var h=location.hash.slice(1),i=P.map(function(p){return p.id}).indexOf(h);
  if(i>-1){detail(i);$("vHome").hidden=true;$("vDetail").hidden=false;anim($("vDetail"));window.scrollTo({top:0,left:0,behavior:"instant"})}
  else{cur=-1;$("vDetail").hidden=true;$("vHome").hidden=false;anim($("vHome"));if(h==="plans"){$("gallery").scrollIntoView()}else{window.scrollTo({top:0,left:0,behavior:"instant"})}}
}
Array.prototype.forEach.call(document.querySelectorAll(".tile"),function(t,i){t.addEventListener("click",function(){location.hash=P[i].id})});
Array.prototype.forEach.call(document.querySelectorAll("[data-go]"),function(b){b.addEventListener("click",function(){toQuote(b.getAttribute("data-sel"))})});
$("dGo").addEventListener("click",function(){toQuote(cur+2)});
function back(){location.hash="plans"}
$("back1").addEventListener("click",back);$("back2").addEventListener("click",back);
window.addEventListener("hashchange",route);
$("lang").addEventListener("click",function(){lang=lang==="zh"?"en":"zh";try{localStorage.setItem("lang",lang)}catch(e){}apply()});
var qs=1;
function chips(id,name,list){
  var box=$(id),sel=document.querySelector('input[name="'+name+'"]:checked'),keep=sel?+sel.value:-1;box.innerHTML="";
  list.forEach(function(txt,i){var l=el("label","chip"),r=document.createElement("input");r.type="radio";r.name=name;r.value=i;if(i===keep)r.checked=true;l.appendChild(r);l.appendChild(el("span","",txt));box.appendChild(l)});
}
function rv(name){var r=document.querySelector('input[name="'+name+'"]:checked');return r?+r.value:-1}
function clearErr(){Array.prototype.forEach.call(document.querySelectorAll(".err"),function(e){e.textContent=""})}
function updStep(){
  var d=T[lang];
  Array.prototype.forEach.call(document.querySelectorAll(".step"),function(s){s.hidden=+s.getAttribute("data-s")!==qs});
  Array.prototype.forEach.call($("prog").children,function(li,i){li.className=i+1===qs?"on":(i+1<qs?"done":"")});
  $("stp").textContent=d.stepOf.replace("{0}",qs);
  $("prev").hidden=qs===1;$("prev").textContent=d.prev;
  $("nx").textContent=qs<3?d.next:d.submit;
}
function valid(s){
  var d=T[lang],ok=true;clearErr();
  function bad(id,m){$(id).textContent=m;ok=false}
  if(s===1){
    if(!$("fn").value.trim())bad("eName",d.eReq);
    var dob=$("dob").value,ag=$("age").value.trim();
    if(!dob&&!ag)bad("eAge",d.eAge);
    else if(ag&&(isNaN(+ag)||+ag<0||+ag>100))bad("eAge",d.eAge);
    else if(dob&&new Date(dob)>new Date())bad("eAge",d.eAge);
    if(rv("g")<0)bad("eGender",d.eReq);
    if(!$("fp").value.trim())bad("ePhone",d.eReq);
    if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test($("em").value.trim()))bad("eEmail",d.eEmail);
  }
  if(s===2&&$("b").selectedIndex<1)bad("eBud",d.eReq);
  if(s===3){if(rv("sm")<0)bad("eSm",d.eReq);if(rv("hl")<0)bad("eHl",d.eReq);if(!$("cons").checked)bad("eCons",d.eCons)}
  return ok;
}
function step(n){qs=n;updStep();$("qcard").scrollIntoView({behavior:"smooth",block:"start"})}
function build(){
  var d=T[lang],m=d.msgL,dob=$("dob").value,ag=$("age").value.trim(),x=$("hx").value.trim();
  var a=ag+(ag&&dob?" / ":"")+dob;
  var L2=[d.msgH,m.name+$("fn").value.trim(),m.age+a,m.gender+d.gOpts[rv("g")],m.phone+$("fp").value.trim(),m.email+$("em").value.trim(),m.bud+$("b").value,m.int+$("t").value,m.smoke+d.smOpts[rv("sm")],m.health+d.hOpts[rv("hl")]];
  if(x)L2.push(m.extra+x);
  return L2.join("\n");
}
$("prev").addEventListener("click",function(){step(qs-1)});
$("qf").addEventListener("change",function(e){var g=e.target.closest("fieldset,.f");if(g){Array.prototype.forEach.call(g.querySelectorAll(".err"),function(x){x.textContent=""})}if(e.target.id==="cons")$("eCons").textContent=""});
$("qf").addEventListener("submit",function(e){
  e.preventDefault();
  if(!valid(qs))return;
  if(qs<3){step(qs+1);return}
  var url="https://wa.me/"+PHONE+"?text="+encodeURIComponent(build());
  $("tyBtn").href=url;
  $("qf").reset();qs=1;apply();
  $("qf").hidden=true;$("ty").hidden=false;
  $("qcard").scrollIntoView({behavior:"smooth",block:"start"});
  window.open(url,"_blank","noopener");
});
apply();route();
})();
</script>
